<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{subject}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f7; font-family:Segoe UI, Helvetica, Arial, sans-serif; color:#101828;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background-color:#ffffff; border:1px solid #e4e7ec; border-radius:8px;">

          <!-- Header -->
          <tr>
            <td style="padding:20px 28px; border-bottom:1px solid #e4e7ec;">
              <div style="font-size:16px; font-weight:600; color:#101828;">Modbus Monitor</div>
              <div style="font-size:12px; color:#667085; margin-top:2px;">Genset Room Notification System</div>
            </td>
          </tr>

          <!-- Content of the email (threshold-alert.html, test-email.html, ...) -->
          <tr>
            <td style="padding:28px;">
              {{{content}}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:16px 28px; border-top:1px solid #e4e7ec; font-size:12px; color:#667085;">
              This is an automatic message from Modbus Monitor. Please do not reply to this email.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
